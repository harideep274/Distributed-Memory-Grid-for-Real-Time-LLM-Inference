[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-memory-grid"
version = "0.1.0"
description = "A learning project for distributed LLM inference across worker nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
distributed = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "torch>=2.2",
    "safetensors>=0.4",
    "transformers>=4.39",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
